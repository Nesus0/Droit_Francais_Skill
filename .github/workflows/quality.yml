name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"
      - name: Check essential files
        run: |
          required_files=(
            "SKILL.md"
            "README.md"
            "AUDIT_ULTIME.md"
            "SOURCE_AUDIT.md"
            "SOURCE_CANDIDATES.md"
            "JURISPRUDENCE_COVERAGE.md"
            "BEHAVIOR_AUDIT.md"
            "RELEASE_READINESS.md"
            "droit-francais-skill-v4-threat-model.md"
            "CLAIMS_AUDIT.md"
            "CITATION_AUDIT.md"
            "LEGAL_FRESHNESS_AUDIT.md"
            "ADAPTER_COMPATIBILITY.md"
            "AUDIT_REPRODUCIBILITY.md"
            "PRIVACY_AND_CONFIDENTIALITY.md"
            "LICENSE"
            "LICENSE.fr.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "core/methodology.md"
            "core/system-prompt.md"
            "references/sources.json"
            "references/maintenance.md"
            "schemas/source-registry.schema.json"
            "tools/validate_sources.py"
            "tools/validate_evals.py"
            "tools/create_archive.py"
            "tools/validate_adapters.py"
            "tools/run_llm_evals.py"
            "tools/validate_publication.py"
            "evaluations/README.md"
            "evaluations/cases.jsonl"
            "evaluations/adapter-matrix.json"
            "GOVERNANCE.md"
            "OPEN_SOURCE_READINESS.md"
            "GITHUB_PUBLIC_SURFACE_AUDIT.md"
            "LICENSE_AND_REUSE_AUDIT.md"
            "DESIGN_AND_USABILITY_AUDIT.md"
            ".github/ISSUE_TEMPLATE/legal-error.yml"
            ".github/ISSUE_TEMPLATE/feature-request.yml"
            ".github/pull_request_template.md"
            ".github/workflows/codeql.yml"
            "docs/scope-and-safety.md"
            "adapters/generic/system-prompt.md"
            "adapters/chatgpt/README.md"
            "adapters/chatgpt/instructions.md"
            "adapters/claude/README.md"
            "adapters/gemini/README.md"
            "adapters/perplexity/README.md"
            "profiles/rh.md"
            "profiles/cse.md"
            "profiles/avocat-contentieux.md"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
      - name: Validate source registry
        run: python3 tools/validate_sources.py
      - name: Validate evaluation cases
        run: python3 tools/validate_evals.py
      - name: Check Python syntax
        run: python3 -m py_compile tools/validate_sources.py tools/validate_evals.py tools/create_archive.py tools/validate_adapters.py tools/run_llm_evals.py tools/validate_publication.py
      - name: Validate adapter matrix
        run: python3 tools/validate_adapters.py
      - name: Validate public repository content
        run: python3 tools/validate_publication.py --include-history
      - name: Exercise LLM campaign without network access
        run: python3 tools/run_llm_evals.py --dry-run --output-dir "$RUNNER_TEMP/droit-francais-audit"

  build-zip:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Create ZIP archive
        run: python3 tools/create_archive.py --output "droit-francais-skill-quality-${GITHUB_SHA}.zip"
      - name: Verify deterministic archive
        run: python3 tools/create_archive.py --check-reproducible
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: droit-francais-skill-quality-${{ github.sha }}
          path: droit-francais-skill-quality-${{ github.sha }}.zip
          retention-days: 30
